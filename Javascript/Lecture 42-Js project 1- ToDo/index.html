<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">
  <div class="bg-white max-w-md mx-auto rounded-lg m-5">
    <div class="bg-blue-600 text-white text-xl font-medium p-5">
      <h1 class="">Todo App</h1>
    </div>

    <div class="p-5">
      <form id="todo-form" action="" class="flex gap-5 ">
        <input id="todo-input" class="border border-black flex-1 p-2" type="text" placeholder="Enter task description...">
        <button class="px-4 py-2 text-white bg-blue-600">Add</button>
      </form>

    <div class="flex justify-between pt-6 pb-2 text-sm border-b border-black">
      <p>TASKS (1)</p>
      <p>COMPLETED : 1</p>
    </div>

      <ul class="py-5 flex flex-col gap-3" id="todo-list">
        <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-3 rounded-xl">
          <input data-id="1" type="checkbox">
          <p class="flex-1">Go to gym</p>
          <div class="flex gap-2">
            <button data-id="1">Edit</button>
            <button data-id="1">Delete</button>
          </div>
        </li> -->
      </ul>
    </div>

  </div>

  <script src="index.js"></script>
</body>

</html>
