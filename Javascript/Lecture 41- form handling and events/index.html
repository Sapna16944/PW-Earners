<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  

  <form action="" id="form">
    <div>
      <label for="username">Name : </label>
      <input type="text"  id="username" placeholder="Enter your name">
      <span class="error-message" style="color:red;"></span>
    </div>

    <div>
      <label for="email">Email : </label>
      <input type="email" id="email" placeholder="Email">
      <span class="error-message" style="color:red;"></span>
    </div>

    <div>
      <label for="password">Password : </label>
      <input type="password" id="password" placeholder="Password">
      <span class="error-message" style="color:red;"></span>
    </div>
    
    <p id="pswrd-hint" class="hidden">must be atleast 8 characters</p>

    <div>
      <label for="bio">Bio : </label>
      <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
      <p id="char-count"></p>
      <span class="error-message" style="color:red;"></span>
    </div>

    <div>
      <label for="country">Select your country : </label>
      <select name="country" id="country">
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
      </select>
      <span class="error-message" style="color:red;"></span>
    </div>

    <div>
      <input type="checkbox" id="checkbox">
      <label for="checkbox">I agree to the term and conditions</label>
    </div>

    <button id="btn" type="submit">Create Account</button>
  </form>
  
  <h1 class="hidden">Account created successfully</h1>

  <script src="index.js"></script>
</body>

</html>
