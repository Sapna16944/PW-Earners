<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>

<body>
  <!-- <a href="https://www.google.com/?zx=1786604348914">click here</a> -->
  <h2>Forms</h2>

  <div>
    <form action="submit.html" target="_blank">
      <fieldset>
        <legend>Enter your information</legend>
        <label for="fullName">Full Name : </label>
        <input type="text" id="fullName" placeholder="Enter your name" required>
        <br> <br>

        <label for="email">Email : </label>
        <input type="email" id="email" placeholder="Enter your email">
        <br> <br>

        <label for="password">Password : </label>
        <input type="password" id="password" placeholder="Enter your password">
        <br> <br>

        <label for="checkbox">Are you 18+ : </label>
        <input type="checkbox" id="checkbox">
        <br><br>

        <label for="phoneNumber">Phone Number : </label>
        <input type="tel" id="phoneNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}">
        <br> <br>

        <label for="male">Gender : </label>

        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">

        <label for="female">Female</label>
        <input type="radio" id="female" name="gender">

        <label for="gender">Other</label>
        <input type="radio" id="gender" name="gender">
        <br> <br>

        <label for="DOB">Enter your DOB : </label>
        <input type="date" id="DOB">
        <br> <br>

        <label for="file">Upload photo : </label>
        <input type="file" id="file">
        <br> <br>

        <!-- dropdown list -->
        <label for="city">Select your City : </label>
        <select name="" id="city">
          <option value="">Uttarkashi</option>
          <option value="" selected>TehriGarhwal</option>
          <option value="">Dehradun</option>
          <option value="">Haridwar</option>
          <option value="">Chamoli</option>
          <option value="">Nainital</option>
          <option value="">Almora</option>
          <option value="">Pauri Garhwal</option>
          <option value="">Rudraprayag</option>
          <option value="">Pithoragarh</option>
          <option value="">Udham Singh Nagar</option>
          <option value="">Bageshwar</option>
          <option value="">Champawat</option>
        </select>

        <!-- <input type="submit"> -->


        <br><br>
        <button>click me</button>
      </fieldset>

    </form>
  </div>
</body>

</html>
