<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Homework</title>
</head>

<body>
  <div>
    <h1>Novell Services Login</h1>

    <form action="">
      <fieldset>
        <label for="userName">Username : </label>
        <input type="text" id="userName" name="userName">
        <br><br>
        <label for="password">Password : </label>
        <input type="password" id="password" name="password">
        <br><br>
        <label for="city">City of Employement : </label>
        <input type="text" id="city" name="city">
        <br><br>
        <label for="server">Web Server : </label>
        <select name="server" id="server" >
          <option value="server">--Choose a Server--</option>
          <option value="">Google</option>
          <option value="">Lighttpd</option>
          <option value="">Microsoft IIS</option>
          <option value="">LiteSpeed</option>
          <option value="">Apache</option>
          <option value="">Nginx</option>
        </select>
        <br><br>
        <label for="role">Please specify your role : </label>

        <input type="radio" id="admin" name="admin">
        <label for="admin">Admin</label>

        <input type="radio" id="engineer" name="engineer">
        <label for="admin">Engineer</label>

        <input type="radio" id="manager" name="manager">
        <label for="manager">Manager</label>

        <input type="radio" id="guest" name="guest">
        <label for="guest">Guest</label>
        <br><br>

        <label for="sign">Single Sign-on to the following : </label>
        <input type="checkbox" id="mail" name="mail">
        <label for="mail">Mail</label>

        <input type="checkbox" id="payroll" name="payroll">
        <label for="payroll">Payroll</label>

        <input type="checkbox" id="service" name="service">
        <label for="service">Self-service</label>\<br><br>

        <button>Login</button>
        <button>Reset</button>
      </fieldset>
    </form>
  </div>

  <div>
    <h2>Pete's Pizza Delivery</h2>
    <p>*required fields</p>
    <form action="">
      <fieldset>
        <legend>Customer Details</legend>
        <label for="name">*Name : </label>
        <input type="text" id="name">
        <br><br>

        <label for="address">*Address : </label>
        <input type="text" id="address">
        <br><br>

        <label for="city">*Town/City : </label>
        <input type="text" id="city">
        <br><br>

        <label for="postcode">*Postcode : </label>
        <input type="number" id="postcode">
        <br><br>

        <label for="phoneNumber">*Tel : </label>
        <input type="tel" id="phoneNumber">
        <br><br>

        <label for="email">*Email : </label>
        <input type="email" id="email">
        <br><br>
      </fieldset>
      <fieldset>
        <legend>Topping*</legend>
        <input type="radio" id="Margherita" name="topping">
        <label for="Margherita"> Margherita</label>
        <br><br>
        <input type="radio" id="fourSeasons" name="topping">
        <label for="ourSeasons"> Four Seasons</label>
        <br><br>
        <input type="radio" id="meatFeast" name="topping">
        <label for="meatFeast"> Meat Feast </label>
        <br><br>
      </fieldset>
      <fieldset>
        <legend>Size*</legend>
        <input type="radio" id="small" name="size">
        <label for="small"> Small</label>
        <br><br>
        <input type="radio" id="medium" name="size">
        <label for="medium"> Medium</label>
        <br><br>
        <input type="radio" id="large" name="size">
        <label for="large"> Large </label>
        <br><br>
      </fieldset>
      <fieldset>
        <legend>Extras*</legend>
        <input type="checkbox" id="mushrooms" name="extras">
        <label for="mushrooms">Mushrooms</label>
        <br><br>
        <input type="checkbox" id="greenPeppers" name="extras">
        <label for="greenPeppers">Green Peppers</label>
        <br><br>
        <input type="checkbox" id="Anchovies" name="extras">
        <label for="Anchovies">Anchovies </label>
        <br><br>
      </fieldset>
      <fieldset>
        <legend>Delivery*</legend>
        <label for="time">Preferred Delivery Time : </label>
        <input type="time" id="time" >
        <br><br>
        <label for="instructions">Delivery Instructions : </label>
        <br>
        <textarea name="" id="instructions"></textarea>
      </fieldset>
      <br><br>
      <button>Submit Order</button>
    </form>
  </div>

</body>

</html>
