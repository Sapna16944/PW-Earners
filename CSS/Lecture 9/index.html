<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS</title>

  <!-- external CSS -->
  <link rel="stylesheet" href="index.css">

  <!-- internal CSS -->
  <style>
    p {
      color: rgb(195, 31, 58);
    }
  </style>
</head>

<body>

  <!-- inline CSS -->
  <h1 style="color:rgb(71, 58, 250)">Learning CSS</h1>
  <p>Hey Sapna</p>
  <span>Hey Vishal</span>
  <h2 style="color:chartreuse">How are you</h2>

  <!-- element selector -->
  <h3>hey neha</h3>
  <h3>hey khushbu</h3>
  <h3>hey ishu</h3>

  <a href="">click me</a>
  <ul>
    <li>list1</li>
    <li>list2</li>
    <li>list3</li>
    <li>list4</li>
  </ul>

  <!-- class selector -->
  <h3 class="heading">oyee</h3>
  <h5 class="heading">what are u doing</h5>
  <h6 class="heading">nothing</h6>
  <p class="heading">ohoooo</p>


  <!-- id selector -->
  <p id="nihal">hii nihal</p>


<h2>Hello Sakshi</h2>

<div>
  hehehe
  <a href="">hello</a>
  <p>hii1</p>
  <p>hii2</p>
  <p>hii3</p>
  <p>hii4</p>
  <section>
    <p>section wala p</p>
  </section>
</div>

</body>

</html>
