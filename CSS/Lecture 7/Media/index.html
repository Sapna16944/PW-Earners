<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media</title>
</head>
<body>
  <!-- from google -->

  <img src="https://img.magnific.com/free-photo/cosmos-flowers_1373-83.jpg?semt=ais_test_b&w=740&q=80" alt="flower image" width=300px height=300px;>

  <!-- from local system -->

   <img src="sapna.jpeg" alt="sapna image" height="300px" width="500px">

   <!-- figure and figcaption tag -->

   <figure>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRJrac7y6n4oOZpRnXp3wpD1dJsGLBj0KbYkXBJG7oMA&s" alt="" height="300px" width="300px">
    <figcaption>
      Flowers, also known as blossoms and blooms, are the reproductive structures of flowering plants.
    </figcaption>
   </figure>

   <!-- video tag -->

    <video src="video.mp4" height="500px" width="500px" controls poster="sapna.jpeg"></video>

    <!-- audio tag -->
     <audio src="audio.mp3" height="500px" width="500px"></audio>

    <!-- iframe tag -->

    <iframe width="560" height="315" src="https://www.youtube.com/embed/WoRrY0s5l8c?si=RAGrWfw3lcP3uDjz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!-- embed google map using iframe -->

    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d27579.33029323596!2d78.8037632!3d30.2252032!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1786682752323!5m2!1sen!2sin" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    
</body>
</html>
